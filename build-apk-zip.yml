name: Build LIFE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LIFE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find and extract LIFE project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf /tmp/life_project
          mkdir -p /tmp/life_project
          unzip -q "$ZIP_FILE" -d /tmp/life_project

          PROJECT_DIR="$(find /tmp/life_project -type f -name 'settings.gradle.kts' -printf '%h\n' -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find /tmp/life_project -type f -name 'settings.gradle' -printf '%h\n' -quit)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts/settings.gradle was not found inside the ZIP."
            find /tmp/life_project -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"

          rm -rf /tmp/life_clean
          mkdir -p /tmp/life_clean
          cp -a "$PROJECT_DIR"/. /tmp/life_clean/

          rm -rf ./* ./.??* 2>/dev/null || true
          cp -a /tmp/life_clean/. .

          echo "Project extracted into repository workspace."

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts || test -f settings.gradle
          test -d app
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew

          echo "Android project structure OK."

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build LIFE debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Upload LIFE APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
